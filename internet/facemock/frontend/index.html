<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FaceMock</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="navbar">
        <div class="logo">FaceMock</div>

        <div class="nav-user">
            Social Network
        </div>
    </header>


    <main>

        <!-- CREATE USER -->

        <section class="card">

            <h2>Create Account</h2>

            <div class="user-row">

                <input
                    id="username"
                    type="text"
                    placeholder="Enter username"
                >

                <button onclick="createUser()">
                    Create
                </button>

            </div>

            <p id="userResult"></p>

        </section>


        <!-- CREATE POST -->

        <section class="card">

            <h2>Create Post</h2>

            <input
                id="userId"
                type="number"
                placeholder="User ID"
            >

            <textarea
                id="caption"
                rows="4"
                placeholder="What's on your mind?"
            ></textarea>

            <input
                id="media"
                type="file"
                accept="image/*,video/*"
            >

            <button
                class="publish"
                onclick="createPost()"
            >
                Publish Post
            </button>

            <p id="postResult"></p>

        </section>


        <!-- FEED -->

        <section>

            <h2 class="feed-heading">
                News Feed
            </h2>

            <div id="feed">

                <p class="loading">
                    Loading posts...
                </p>

            </div>

        </section>

    </main>


    <script src="app.js"></script>

</body>

</html>
